<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🌌 Nova Game Vault</title><style>*{box-sizing:border-box}body{margin:0;background:#03030d;color:#fff;font:16px system-ui,Segoe UI,sans-serif}main{max-width:1200px;margin:auto;padding:28px}h1{margin:0 0 6px;font-size:32px}p{color:#aeb7d4}input{width:100%;padding:14px 16px;background:#11162d;color:#fff;border:1px solid #34405f;border-radius:12px;outline:0;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.card{padding:18px;border:1px solid #ffffff1c;border-radius:16px;background:#0c1024}.tag{display:inline-block;margin-top:8px;padding:4px 8px;border-radius:99px;background:#18213d;color:#9ec8ff;font-size:12px}.play{margin-top:12px;width:100%;padding:10px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}#player{display:none;margin:24px 0;padding:14px;background:#0c1024;border:1px solid #ffffff1c;border-radius:16px}#player.show{display:block}iframe{display:block;width:100%;height:620px;border:0;border-radius:12px;background:#000}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.close{padding:9px 12px;border:1px solid #ffffff33;background:#151b31;color:#fff;border-radius:9px;cursor:pointer}</style></head><body><main><div class="top"><div><h1>🌌 Nova Game Vault</h1><p>Games open directly inside Nova.</p></div></div><input id="s" placeholder="Search games..."><section id="player"><div class="top"><h2 id="title">Game</h2><button class="close" id="close">Close</button></div><iframe id="frame" title="Nova game" allow="fullscreen; autoplay; gamepad"></iframe></section><div id="g" class="grid"></div><script>const games=[["Snake","Arcade","games/snake.html"],["Flappy Nova","Arcade","games/flappy.html"],["Breakout","Arcade","games/breakout.html"],["Pong","2 Player","games/pong.html"],["Tic-Tac-Toe","Strategy","games/tictactoe.html"],["2048","Puzzle","games/2048.html"],["Minesweeper","Puzzle","games/minesweeper.html"],["Nova Clicker","Idle","games/clicker.html"]];const g=document.getElementById("g"),s=document.getElementById("s"),player=document.getElementById("player"),frame=document.getElementById("frame"),title=document.getElementById("title");function render(){let q=s.value.toLowerCase();g.innerHTML=games.filter(a=>a[0].toLowerCase().includes(q)||a[1].toLowerCase().includes(q)).map(a=>'<div class="card"><b>'+a[0]+'</b><div class="tag">'+a[1]+'</div><button class="play" onclick="openGame(\''+a[0]+'\',\''+a[2]+'\')">Play</button></div>').join("")}function openGame(t,u){title.textContent=t;frame.src=u;player.classList.add("show");player.scrollIntoView({behavior:"smooth",block:"start"})}document.getElementById("close").onclick=()=>{frame.src="about:blank";player.classList.remove("show")};s.oninput=render;render();</script></main></body></html>
