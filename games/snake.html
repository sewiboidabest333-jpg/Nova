<!doctype html><html><body style="margin:0;background:#080b16;color:white;font:16px system-ui;text-align:center"><h2>🐍 Snake</h2><p>Arrow keys / WASD</p><canvas id="c" width="480" height="480" style="max-width:90vw;background:#10172a"></canvas><p id="score">Score: 0</p><script>const c=document.getElementById('c'),x=c.getContext('2d'),n=24,s=20;let snake=[{x:12,y:12}],d={x:1,y:0},next=d,food={x:5,y:5},score=0;function spawn(){food={x:Math.floor(Math.random()*n),y:Math.floor(Math.random()*n)}}addEventListener('keydown',e=>{let k=e.key.toLowerCase(),m={arrowup:{x:0,y:-1},w:{x:0,y:-1},arrowdown:{x:0,y:1},s:{x:0,y:1},arrowleft:{x:-1,y:0},a:{x:-1,y:0},arrowright:{x:1,y:0},d:{x:1,y:0}}[k];if(m&&!(m.x===-d.x&&m.y===-d.y))next=m});setInterval(()=>{d=next;let h={x:(snake[0].x+d.x+n)%n,y:(snake[0].y+d.y+n)%n};if(snake.some(p=>p.x===h.x&&p.y===h.y)){snake=[{x:12,y:12}];d=next={x:1,y:0};score=0;spawn()}else{snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;spawn()}else snake.pop()}scoreEl.textContent='Score: '+score;draw()},100);const scoreEl=document.getElementById('score');function draw(){x.clearRect(0,0,480,480);x.fillStyle='#ef4444';x.fillRect(food.x*s,food.y*s,s-2,s-2);x.fillStyle='#4ade80';snake.forEach(p=>x.fillRect(p.x*s,p.y*s,s-2,s-2))}draw();</script></body></html>
