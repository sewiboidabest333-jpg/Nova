<!doctype html><html><body style="margin:0;background:#111827;color:white;font:16px system-ui;text-align:center"><h2>💣 Minesweeper</h2><p>Click tiles. Avoid mines.</p><div id="b" style="display:grid;grid-template-columns:repeat(10,34px);gap:2px;width:max-content;margin:auto"></div><p id="m"></p><script>let mines=new Set();while(mines.size<12)mines.add(Math.floor(Math.random()*100));let open=new Set(),b=document.getElementById('b'),m=document.getElementById('m');function n(i){let c=0,x=i%10,y=Math.floor(i/10);for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){let q=(y+dy)*10+x+dx;if((dx||dy)&&q>=0&&q<100&&Math.floor(q/10)===y+dy&&mines.has(q))c++}return c}window.go=i=>{if(open.has(i))return;if(mines.has(i)){m.textContent='Mine hit! Refresh to try again.';return}open.add(i);draw()};function draw(){b.innerHTML=Array.from({length:100},(_,i)=>'<button onclick="go('+i+')" style="width:34px;height:34px;background:'+(open.has(i)?'#94a3b8':'#334155')+';border:0;color:#111827;font-weight:bold">'+(open.has(i)?n(i)||'':'')+'</button>').join('')}draw();</script></body></html>
