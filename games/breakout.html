<!doctype html><html><body style="margin:0;background:#090b14;color:white;font:16px system-ui;text-align:center"><h2>🧱 Breakout</h2><p>Move with A/D or ←/→</p><canvas id="c" width="640" height="480" style="max-width:95vw;background:#111827"></canvas><p id="m"></p><script>const c=document.getElementById('c'),x=c.getContext('2d'),m=document.getElementById('m');let px=285,b={x:320,y:420,dx:4,dy:-4},keys={},br=[];for(let r=0;r<5;r++)for(let j=0;j<9;j++)br.push({x:20+j*68,y:30+r*25,on:1});onkeydown=e=>keys[e.key]=1;onkeyup=e=>keys[e.key]=0;function loop(){if(keys.ArrowLeft||keys.a)px-=6;if(keys.ArrowRight||keys.d)px+=6;px=Math.max(0,Math.min(570,px));b.x+=b.dx;b.y+=b.dy;if(b.x<8||b.x>632)b.dx*=-1;if(b.y<8)b.dy*=-1;if(b.y>445&&b.x>px&&b.x<px+70)b.dy=-Math.abs(b.dy);for(const q of br)if(q.on&&b.x>q.x&&b.x<q.x+62&&b.y>q.y&&b.y<q.y+18){q.on=0;b.dy*=-1}if(b.y>480){m.textContent='Game over — refresh to play again';return}x.clearRect(0,0,640,480);x.fillStyle='#38bdf8';x.fillRect(px,455,70,12);x.fillStyle='#fbbf24';x.beginPath();x.arc(b.x,b.y,8,0,7);x.fill();x.fillStyle='#f472b6';br.forEach(q=>q.on&&x.fillRect(q.x,q.y,62,18));if(br.every(q=>!q.on)){m.textContent='You cleared it!';return}requestAnimationFrame(loop)}loop();</script></body></html>
