<!doctype html><html><body style="margin:0;background:#0b1220;color:white;font:16px system-ui;text-align:center"><h2>🪽 Flappy Nova</h2><p>Space / click to flap</p><canvas id="c" width="480" height="600" style="max-width:90vw;background:#172554"></canvas><p id="sc">Score: 0</p><script>const c=document.getElementById('c'),x=c.getContext('2d'),sc=document.getElementById('sc');let y=280,v=0,pipes=[],score=0,over=false,t=0;function flap(){if(over){y=280;v=0;pipes=[];score=0;over=false}else v=-8}onkeydown=e=>{if(e.code==='Space')flap()};onclick=flap;function loop(){t++;v+=.42;y+=v;if(t%100===0)pipes.push({x:480,g:120+Math.random()*300});pipes.forEach(p=>p.x-=3);pipes=pipes.filter(p=>p.x>-60);for(const p of pipes){if(p.x<70&&p.x+60>20&&(y<p.g-90||y>p.g+90))over=true;if(Math.round(p.x)===68)score++}if(y<0||y>600)over=true;sc.textContent='Score: '+score+(over?' — click to restart':'');x.clearRect(0,0,480,600);x.fillStyle='#38bdf8';x.fillRect(0,0,480,600);x.fillStyle='#facc15';x.fillRect(40,y,30,24);x.fillStyle='#22c55e';pipes.forEach(p=>{x.fillRect(p.x,0,60,p.g-90);x.fillRect(p.x,p.g+90,60,600)});requestAnimationFrame(loop)}loop();</script></body></html>
