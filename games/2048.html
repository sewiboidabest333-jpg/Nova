<!doctype html><html><body style="margin:0;background:#faf8ef;color:#776e65;font:16px system-ui;text-align:center"><h2>2048</h2><p>Use arrow keys</p><div id="b" style="display:grid;grid-template-columns:repeat(4,90px);gap:8px;background:#bbada0;padding:8px;width:max-content;margin:auto;border-radius:8px"></div><p id="s">Score: 0</p><script>let a=Array(16).fill(0),score=0;function add(){let e=a.map((v,i)=>v?null:i).filter(v=>v!==null);if(e.length)a[e[Math.floor(Math.random()*e.length)]]=Math.random()<.9?2:4}add();add();function move(dir){let old=a.join(),lines=[];for(let r=0;r<4;r++)lines.push(dir==='up'||dir==='down'?[a[r],a[r+4],a[r+8],a[r+12]]:[a[r*4],a[r*4+1],a[r*4+2],a[r*4+3]]);if(dir==='down'||dir==='right')lines=lines.map(l=>l.reverse());lines=lines.map(l=>{l=l.filter(Boolean);for(let i=0;i<l.length-1;i++)if(l[i]===l[i+1]){l[i]*=2;score+=l[i];l.splice(i+1,1)}while(l.length<4)l.push(0);return l});if(dir==='down'||dir==='right')lines=lines.map(l=>l.reverse());if(dir==='up'||dir==='down')for(let r=0;r<4;r++)a[r]=lines[r][0],a[r+4]=lines[r][1],a[r+8]=lines[r][2],a[r+12]=lines[r][3];else for(let r=0;r<4;r++)for(let j=0;j<4;j++)a[r*4+j]=lines[r][j];if(old!==a.join())add();draw()}onkeydown=e=>{let d={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(d)move(d)};function draw(){b.innerHTML=a.map(v=>'<div style="width:90px;height:90px;background:#eee4da;display:grid;place-items:center;font-size:28px;font-weight:700">'+(v||'')+'</div>').join('');s.textContent='Score: '+score}draw();</script></body></html>
