<!doctype html><html><body style="margin:0;background:#090b14;color:white;font:16px system-ui;text-align:center"><h2>⭕ Tic-Tac-Toe</h2><div id="b" style="display:grid;grid-template-columns:repeat(3,100px);gap:6px;width:312px;margin:auto"></div><p id="m">Your turn: X</p><script>let a=Array(9).fill(''),turn='X',b=document.getElementById('b'),m=document.getElementById('m');function win(){return [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].find(q=>q.every(i=>a[i]===turn))}function draw(){b.innerHTML=a.map((v,i)=>'<button onclick="go('+i+')" style="height:100px;font-size:42px;background:#172033;color:white;border:1px solid #334155">'+v+'</button>').join('')}window.go=i=>{if(a[i]||win())return;a[i]=turn;if(win()){m.textContent=turn+' wins!'}else if(a.every(Boolean)){m.textContent='Draw!'}else{turn=turn==='X'?'O':'X';m.textContent='Turn: '+turn}draw()};draw();</script></body></html>
