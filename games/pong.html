<!doctype html><html><body style="margin:0;background:#090b14;color:white;font:16px system-ui;text-align:center"><h2>🏓 Pong</h2><p>Left: W/S &nbsp; Right: ↑/↓</p><canvas id="c" width="700" height="420" style="max-width:95vw;background:#020617"></canvas><p id="sc">0 — 0</p><script>const c=document.getElementById('c'),x=c.getContext('2d'),sc=document.getElementById('sc');let a=170,b=170,ball={x:350,y:210,dx:5,dy:3},L=0,R=0,k={};onkeydown=e=>k[e.key]=1;onkeyup=e=>k[e.key]=0;function loop(){if(k.w)a-=6;if(k.s)a+=6;if(k.ArrowUp)b-=6;if(k.ArrowDown)b+=6;a=Math.max(0,Math.min(340,a));b=Math.max(0,Math.min(340,b));ball.x+=ball.dx;ball.y+=ball.dy;if(ball.y<8||ball.y>412)ball.dy*=-1;if(ball.x<35&&ball.y>a&&ball.y<a+80)ball.dx=Math.abs(ball.dx);if(ball.x>665&&ball.y>b&&ball.y<b+80)ball.dx=-Math.abs(ball.dx);if(ball.x<0){R++;reset()}if(ball.x>700){L++;reset()}sc.textContent=L+' — '+R;x.clearRect(0,0,700,420);x.fillStyle='white';x.fillRect(20,a,12,80);x.fillRect(668,b,12,80);x.fillRect(ball.x-6,ball.y-6,12,12);requestAnimationFrame(loop)}function reset(){ball={x:350,y:210,dx:(Math.random()>.5?5:-5),dy:3}}loop();</script></body></html>
